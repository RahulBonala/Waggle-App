<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Waggle India — Walks &amp; Care">
  <!-- Rahul Mark System v2 — Data field: trust-blue #1A4D8C / paper glyph, 7.9:1
       Two prints, walking. The field keeps the trust-blue token (live in
       Waggle-App/src/index.css) under the design language's data-colour
       exception: in a pet-care marketplace the blue carries "verified", it is
       not decoration.

       The second print replaces the wordmark's swoosh, which could not be made
       to work here. Any roughly horizontal arc under the pads turned the whole
       mark into a face — pads for eyes, arc for a mouth — and moving it merely
       made it read as a stray stroke. Two prints say "walks" outright and the
       diagonal kills the symmetry the face illusion needed.

       The trailing print is orange-300 #ffa76e and is marked accent: the mark
       reads with only the white print, so it is held to the 3:1 floor (it
       clears 4.4:1). Orange-500 is 2.98:1 on this field and would miss even
       that. -->
  <rect width="512" height="512" rx="114" fill="#1A4D8C"/>
  <svg x="84" y="84" width="344" height="344" viewBox="0 0 24 24">
    <g fill="#ffa76e" data-role="accent">
      <ellipse cx="4.4" cy="19.6" rx="2.6" ry="2.1"/>
      <circle cx="1.5" cy="16.5" r="1.15"/>
      <circle cx="4.4" cy="14.9" r="1.2"/>
      <circle cx="7.4" cy="16.3" r="1.15"/>
    </g>
    <g fill="#fbf7f0">
      <ellipse cx="13.4" cy="11.4" rx="5.2" ry="4.2"/>
      <circle cx="6.6" cy="6.4" r="2.3"/>
      <circle cx="11.4" cy="3.4" r="2.45"/>
      <circle cx="16.7" cy="3.8" r="2.35"/>
      <circle cx="20.8" cy="7.3" r="2.15"/>
    </g>
  </svg>
</svg>
